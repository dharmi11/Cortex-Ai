name: Cortex AI Deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

  # =========================
  # BACKEND DEPLOYMENT
  # =========================
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # AWS
      # =========================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # GATEWAY
      # =========================
      - name: Build Gateway
        run: |
          docker build \
            -f Backend/gateway/DockerFile \
            -t gateway:latest \
            Backend

      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/gateway:latest

      - name: Push Gateway
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/gateway:latest

      # =========================
      # AUTH
      # =========================
      - name: Build Auth
        run: |
          docker build \
            -f Backend/services/auth/DockerFile \
            -t auth-service:latest \
            Backend

      - name: Tag Auth
        run: |
          docker tag auth-service:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/auth-service:latest

      - name: Push Auth
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/auth-service:latest

      # =========================
      # CHAT
      # =========================
      - name: Build Chat
        run: |
          docker build \
            -f Backend/services/chat/DockerFile \
            -t chat-services:latest \
            Backend

      - name: Tag Chat
        run: |
          docker tag chat-services:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/chat-services:latest

      - name: Push Chat
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/chat-services:latest

      # =========================
      # AGENT
      # =========================
      - name: Build Agent
        run: |
          docker build \
            -f Backend/services/agent/DockerFile \
            -t agent-services:latest \
            Backend

      - name: Tag Agent
        run: |
          docker tag agent-services:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/agent-services:latest

      - name: Push Agent
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/agent-services:latest

      # =========================
      # BILLING
      # =========================
      - name: Build Billing
        run: |
          docker build \
            -f Backend/services/billing/DockerFile \
            -t billing-services:latest \
            Backend

      - name: Tag Billing
        run: |
          docker tag billing-services:latest \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/billing-services:latest

      - name: Push Billing
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/billing-services:latest

      # =========================
      # ECS DEPLOYMENT
      # =========================
      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY_SERVICE }} \
            --force-new-deployment

      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment

      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment

      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment

      - name: Deploy Billing
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.BILLING_SERVICE }} \
            --force-new-deployment


  # =========================
  # FRONTEND DEPLOYMENT
  # =========================
 deploy-frontend:
  needs: deploy-backend
  runs-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Frontend
      run: |
        cd Frontend
        npm install
        npm run build

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Upload to S3
      run: |
        aws s3 sync \
          Frontend/dist \
          s3://${{ secrets.S3_BUCKET }} \
          --delete

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"